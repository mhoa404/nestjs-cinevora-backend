# =============================================================================
# Cinevora Backend — Docker Compose (Local/Development Environment)
# =============================================================================
# Usage:
#   docker compose up -d            # Start all services
#   docker compose logs -f app      # Follow app logs
#   docker compose down             # Stop all services
#   docker compose down -v          # Stop and remove volumes (reset data)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application — NestJS Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinevora-backend
    image: cinevora-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Override DB/Redis hosts to use Docker service names
      DB_HOST: localhost
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinevora-network
    # Resource limits to prevent runaway processes in dev
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # MySQL 8 — Primary Database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0-debian
    container_name: cinevora-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cinevora-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # MySQL tuning for development
    command: >
      --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M --max-connections=100

  redis:
    image: redis:7-alpine
    container_name: cinevora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - cinevora-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Redis configuration for development
    command: >
      redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: cinevora-jenkins
    image: cinevora-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
      DOCKER_HOST: unix:///var/run/docker.sock
    networks:
      - cinevora-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
    driver: local
    name: cinevora-mysql-volume

networks:
  cinevora-network:
    driver: bridge
    name: cinevora-network
